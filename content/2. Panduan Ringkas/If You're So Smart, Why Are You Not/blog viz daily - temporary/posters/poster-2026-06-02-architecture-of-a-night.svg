    <text x="600" y="1300" text-anchor="middle" font-size="33" font-weight="600" letter-spacing="0" fill="#E6E8EE">YOU DON&#8217;T TAKE SLEEP. <tspan fill="#8B7CF0">YOU BUILD IT.</tspan></text>
    <text x="600" y="1344" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="14" fill="#A1A1AA">everything after this just defends the architecture.</text>
    <line x1="70" y1="1410" x2="1130" y2="1410" stroke="#71717A" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="1448" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" letter-spacing="2" fill="#71717A">PART 1 OF 5&#160;&#160;·&#160;&#160;SLEEP&#160;&#160;·&#160;&#160;THE HEALTHY PILLAR</text>
    <text x="1130" y="1448" text-anchor="end" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12.5" letter-spacing="2" fill="#71717A">IF YOU&#8217;RE SO SMART, WHY ARE YOU NOT</text>
