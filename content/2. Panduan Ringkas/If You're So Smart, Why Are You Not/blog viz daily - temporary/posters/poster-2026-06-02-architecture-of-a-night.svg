        <text x="272" y="1012">&#9670;&#160;&#160;Tissue repair&#160;&#160;<tspan fill="#A1A1AA" font-size="12.5">muscle &amp; bone</tspan></text>
        <text x="272" y="1052">&#9670;&#160;&#160;Glymphatic clearance&#160;&#160;<tspan fill="#A1A1AA" font-size="12.5">brain trash-out</tspan></text>
