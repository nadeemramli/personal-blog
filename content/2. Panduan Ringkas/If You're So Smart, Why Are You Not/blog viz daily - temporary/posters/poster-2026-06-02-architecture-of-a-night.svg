      <g font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15" fill="#E6E8EE">
        <text x="732" y="972">&#9671;&#160;&#160;Memory integration&#160;&#160;<tspan fill="#A1A1AA" font-size="12.5">filing the day</tspan></text>
        <text x="732" y="1012">&#9671;&#160;&#160;Emotional recalibration&#160;&#160;<tspan fill="#A1A1AA" font-size="12.5">takes off the charge</tspan></text>
        <text x="732" y="1052">&#9671;&#160;&#160;Creativity&#160;&#160;<tspan fill="#A1A1AA" font-size="12.5">&#8220;sleep on it&#8221;</tspan></text>
