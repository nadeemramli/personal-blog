      <line x1="710" y1="930" x2="1140" y2="930" stroke="#8B7CF0" stroke-opacity="0.3" stroke-width="1"/>
      <text x="732" y="914" font-size="26" font-weight="600" fill="#8B7CF0">THE BRAIN</text>
