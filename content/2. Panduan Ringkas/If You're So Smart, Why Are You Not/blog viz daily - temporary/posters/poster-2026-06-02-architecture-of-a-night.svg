      <line x1="690" y1="772" x2="690" y2="780"/><line x1="800" y1="772" x2="800" y2="780"/>
      <line x1="910" y1="772" x2="910" y2="780"/><line x1="1020" y1="772" x2="1020" y2="780"/>
      <line x1="1130" y1="772" x2="1130" y2="780"/>
