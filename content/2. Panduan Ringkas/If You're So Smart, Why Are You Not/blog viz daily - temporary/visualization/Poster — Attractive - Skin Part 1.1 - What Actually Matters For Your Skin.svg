<svg viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .ink{fill:#1E2024;}
      .mono{font-family:ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace;}
      .warm{fill:#C2703D;}
      .slate{fill:#5E7585;}
      .red{fill:#D9483B;}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2024" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <pattern id="scaffold" width="34" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 40 L17 0 L34 40 M-17 40 L0 0 M17 40 L34 0 L51 40" fill="none" stroke="#C2703D" stroke-width="2.2"/>
    </pattern>
    <pattern id="scaffoldGhost" width="30" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 40 L15 6 L30 40 M-15 40 L0 6 M15 40 L30 6 L45 40" fill="none" stroke="#9A9590" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#C2703D" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatchGhost" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#A39E98" stroke-width="1.2"/>
    </pattern>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="ink"/></marker>
    <marker id="ahS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" class="slate"/></marker>
    <marker id="dimS" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M4 0 L4 8 M1 1.5 L4 0 L7 1.5 M1 6.5 L4 8 L7 6.5" fill="none" stroke="#5E7585" stroke-width="1"/></marker>
  </defs>

  <rect width="1200" height="1500" fill="#F4F1EA"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#1E2024" stroke-width="1" opacity="0.35"/>

  <!-- ===================== HEADER ===================== -->
  <g id="header">
    <text x="80" y="98" class="ink" font-size="39" font-weight="700" letter-spacing="1.5">THE CHEAP LAYER CARRIES THE BUILDING.</text>
    <text x="80" y="132" class="mono ink" font-size="15" letter-spacing="3" opacity="0.7">SKIN / PART 1.1 — WHAT ACTUALLY MATTERS FOR YOUR SKIN</text>
    <line x1="80" y1="150" x2="1120" y2="150" stroke="#1E2024" stroke-width="1.2"/>
    <text x="80" y="176" class="mono ink" font-size="13" letter-spacing="2" opacity="0.65">PART 1.1 OF 4 · SKIN · THE ATTRACTIVE PILLAR</text>
    <g class="mono ink" opacity="0.8">
      <text x="1120" y="176" font-size="13" letter-spacing="2" text-anchor="end">READ OUTSIDE → IN</text>
      <line x1="930" y1="171" x2="985" y2="171" stroke="#1E2024" stroke-width="1.2" marker-end="url(#ah)"/>
    </g>
  </g>

  <!-- ===================== HERO : SOUND ASSEMBLY ===================== -->
  <g id="hero">
    <!-- column geometry: slab x 150..610 -->
    <!-- ground / grade reference -->
    <text x="80" y="230" class="mono ink" font-size="13" letter-spacing="2" opacity="0.55">THE WEATHER — four ranked forces, one dwarfs the rest</text>

    <!-- WEATHER ARROWS -->
    <!-- UV : dominant red -->
    <g id="uv">
      <path d="M250 250 L370 250 L370 300 L405 300 L310 372 L215 300 L250 300 Z" class="red"/>
      <text x="310" y="300" class="mono" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">UV</text>
      <text x="310" y="245" class="mono red" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="1">PHOTOAGING · ~80%</text>
    </g>
    <!-- INTRINSIC : thin -->
    <g id="intrinsic">
      <line x1="470" y1="255" x2="470" y2="356" stroke="#1E2024" stroke-width="4" marker-end="url(#ah)"/>
      <text x="470" y="245" class="mono ink" font-size="12" text-anchor="middle" letter-spacing="1">INTRINSIC · TIME</text>
      <text x="470" y="230" class="mono ink" font-size="10.5" text-anchor="middle" opacity="0.6">−1%/yr</text>
    </g>
    <!-- GLYCATION : medium, angled in from diet/inside side (right) -->
    <g id="glycation">
      <line x1="640" y1="248" x2="556" y2="352" stroke="#1E2024" stroke-width="9" marker-end="url(#ah)"/>
      <text x="660" y="244" class="mono ink" font-size="12.5" letter-spacing="1">GLYCATION · SUGAR</text>
      <text x="660" y="260" class="mono ink" font-size="10.5" opacity="0.6">AGEs stiffen the scaffold</text>
    </g>
    <!-- HORMONAL : small -->
    <g id="hormonal">
      <line x1="180" y1="290" x2="216" y2="350" stroke="#1E2024" stroke-width="5" marker-end="url(#ah)"/>
      <text x="120" y="282" class="mono ink" font-size="11.5" letter-spacing="1">HORMONAL</text>
      <text x="120" y="297" class="mono ink" font-size="10" opacity="0.6">thickness·sebum</text>
    </g>

    <!-- ASSEMBLY : thickness = leverage -->
    <!-- LAYER 1 PROTECT : thick load-bearing slab -->
    <rect x="150" y="378" width="460" height="132" fill="#C2703D"/>
    <rect x="150" y="378" width="460" height="132" fill="url(#hatch)" opacity="0.18"/>
    <text x="380" y="436" class="mono" fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle" letter-spacing="3">PROTECT</text>
    <text x="380" y="466" class="mono" fill="#FFFFFF" font-size="14" text-anchor="middle" opacity="0.92">SPF · UV avoidance · sleep · diet · no smoking</text>
    <text x="380" y="492" class="mono" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">free / cheap · ~90% OF THE RESULT</text>

    <!-- LAYER 2 CORE ACTIVES : thin membrane -->
    <rect x="150" y="510" width="460" height="34" fill="#D89A6E"/>
    <text x="380" y="532" class="mono ink" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">CORE ACTIVES · the 10% · on top, not instead</text>

    <!-- grade line -->
    <line x1="120" y1="556" x2="700" y2="556" stroke="#1E2024" stroke-width="2"/>
    <g class="mono ink" font-size="10" opacity="0.6">
      <line x1="120" y1="556" x2="108" y2="568" stroke="#1E2024" stroke-width="1"/>
      <line x1="150" y1="556" x2="138" y2="568" stroke="#1E2024" stroke-width="1"/>
      <line x1="180" y1="556" x2="168" y2="568" stroke="#1E2024" stroke-width="1"/>
      <text x="640" y="551">grade</text>
    </g>

    <!-- DIMENSION LINES : the leverage argument -->
    <g class="slate">
      <line x1="118" y1="378" x2="118" y2="510" stroke="#5E7585" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimS)"/>
      <text x="100" y="448" class="mono slate" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90 100 448)">~90%</text>
      <line x1="630" y1="510" x2="630" y2="544" stroke="#5E7585" stroke-width="1.2" marker-start="url(#dimS)" marker-end="url(#dimS)"/>
      <text x="648" y="532" class="mono slate" font-size="13" font-weight="700">10%</text>
    </g>

    <!-- COLLAGEN SCAFFOLD : below grade, finite substrate -->
    <rect x="150" y="556" width="460" height="170" fill="url(#scaffold)" opacity="0.9"/>
    <rect x="150" y="556" width="460" height="170" fill="none" stroke="#C2703D" stroke-width="1.5" opacity="0.5"/>

    <!-- LAYER 3 PROCEDURES : repair brackets pinned into scaffold -->
    <g id="procedures">
      <path d="M205 575 h44 v10 m0 -10 v40 m0 -40 h-44 v40" fill="none" stroke="#1E2024" stroke-width="3"/>
      <path d="M295 575 h44 v10 m0 -10 v40 m0 -40 h-44 v40" fill="none" stroke="#1E2024" stroke-width="3"/>
      <text x="628" y="600" class="mono ink" font-size="12.5" font-weight="700">PROCEDURES</text>
      <text x="628" y="615" class="mono ink" font-size="10" opacity="0.65">red light·needling·peels</text>
      <text x="628" y="629" class="mono ink" font-size="10" opacity="0.65">multipliers, not substitutes</text>
      <line x1="345" y1="595" x2="620" y2="600" stroke="#1E2024" stroke-width="0.8" opacity="0.4"/>
    </g>

    <!-- LAYER 4 ENHANCED : sliver / specialist patch -->
    <g id="enhanced">
      <rect x="430" y="588" width="40" height="14" fill="#1E2024"/>
      <path d="M444 580 l8 0 l-4 7 z" class="red"/>
      <text x="628" y="666" class="mono ink" font-size="12.5" font-weight="700">ENHANCED <tspan class="red">▲ Rx</tspan></text>
      <text x="628" y="681" class="mono ink" font-size="10" opacity="0.65">isotretinoin·GHK-Cu·GH</text>
      <text x="628" y="695" class="mono ink" font-size="10" opacity="0.65">last margin · highest risk</text>
      <line x1="470" y1="595" x2="620" y2="666" stroke="#1E2024" stroke-width="0.8" opacity="0.4"/>
    </g>

    <!-- scaffold caption -->
    <text x="150" y="752" class="mono ink" font-size="12.5" font-weight="700">COLLAGEN IS BUILT, NOT BOUGHT</text>
    <text x="150" y="770" class="mono ink" font-size="11" opacity="0.7">falls −1%/yr · the dermal junction flattens · no new scaffold is made.</text>
  </g>

  <!-- ===================== REVERSED-ASSEMBLY FAILURE GHOST ===================== -->
  <g id="ghost" opacity="0.95">
    <text x="1080" y="330" class="mono ink" font-size="12" letter-spacing="2" opacity="0.55" text-anchor="end">THE REVERSED BUILD</text>
    <!-- unbroken UV arrow pours straight through -->
    <path d="M870 366 L930 366 L930 470 L955 470 L900 540 L845 470 L870 470 Z" class="red" opacity="0.85"/>
    <text x="900" y="358" class="mono red" font-size="13" font-weight="700" text-anchor="middle">UV · UNBROKEN</text>

    <!-- missing protect slab : dashed empty gap -->
    <rect x="800" y="478" width="280" height="60" fill="none" stroke="#A39E98" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text x="940" y="503" class="mono" fill="#9A9590" font-size="12" text-anchor="middle">PROTECT —</text>
    <text x="940" y="521" class="mono" fill="#9A9590" font-size="12" font-weight="700" text-anchor="middle">MISSING</text>

    <!-- bright interior finish patch (laser/serum) installed under the missing roof -->
    <rect x="860" y="544" width="160" height="26" fill="#D89A6E" opacity="0.9"/>
    <text x="940" y="562" class="mono" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">LASER / SERUM ✔</text>

    <!-- bare sagging scaffold being torn -->
    <path d="M800 572 H1080 V726 H800 Z" fill="url(#scaffoldGhost)" opacity="0.85"/>
    <path d="M800 572 H1080 V726 H800 Z" fill="url(#hatchGhost)" opacity="0.35"/>
    <path d="M820 600 q60 40 120 6 q60 -34 120 12" fill="none" stroke="#D9483B" stroke-width="2.4" opacity="0.7"/>
    <path d="M820 660 q70 44 130 4 q55 -30 110 14" fill="none" stroke="#D9483B" stroke-width="2.4" opacity="0.7"/>

    <text x="800" y="756" class="mono red" font-size="13.5" font-weight="700">WRONG ORDER —</text>
    <text x="800" y="774" class="mono red" font-size="12">paying to repair damage you are still causing.</text>
  </g>

  <!-- ===================== SPEC SHEET (cool slate instrument register) ===================== -->
  <g id="specsheet">
    <line x1="80" y1="812" x2="1120" y2="812" stroke="#5E7585" stroke-width="1.2"/>
    <text x="80" y="836" class="mono slate" font-size="13" letter-spacing="3" font-weight="700">SPEC SHEET — DIAGNOSE · MEASURE · NAVIGATE</text>

    <!-- CARD 1 : SKIN AGE KPI GAUGE -->
    <g id="card1">
      <rect x="80" y="852" width="330" height="200" fill="none" stroke="#5E7585" stroke-width="1.2" rx="6"/>
      <text x="100" y="880" class="mono slate" font-size="13" font-weight="700">SKIN AGE ≠ CHRONOLOGICAL AGE</text>
      <!-- dial -->
      <path d="M150 968 A60 60 0 0 1 270 968" fill="none" stroke="#5E7585" stroke-width="2"/>
      <line x1="150" y1="968" x2="143" y2="968" stroke="#5E7585" stroke-width="2"/>
      <line x1="270" y1="968" x2="277" y2="968" stroke="#5E7585" stroke-width="2"/>
      <!-- needle 64 -> 36 -->
      <line x1="210" y1="968" x2="168" y2="932" stroke="#9A9590" stroke-width="3" opacity="0.6"/>
      <text x="150" y="990" class="mono" fill="#9A9590" font-size="12" text-anchor="middle">64</text>
      <line x1="210" y1="968" x2="244" y2="922" stroke="#C2703D" stroke-width="3.5" marker-end="url(#ah)"/>
      <text x="278" y="924" class="mono warm" font-size="14" font-weight="700">36</text>
      <text x="210" y="1010" class="mono ink" font-size="11" text-anchor="middle">measured (Bryan Johnson)</text>
      <text x="100" y="1030" class="mono ink" font-size="10.5" opacity="0.75">Visia: UV spots · brown/red · pores · skin age</text>
      <text x="100" y="1045" class="mono ink" font-size="10.5" opacity="0.75">+ at-home fixed-light AM photo</text>
    </g>

    <!-- CARD 2 : TYPE BEFORE PROTOCOL -->
    <g id="card2">
      <rect x="435" y="852" width="330" height="200" fill="none" stroke="#5E7585" stroke-width="1.2" rx="6"/>
      <text x="455" y="880" class="mono slate" font-size="13" font-weight="700">TYPE BEFORE PROTOCOL</text>
      <text x="455" y="908" class="mono ink" font-size="11" opacity="0.85">▸ skin type</text>
      <text x="472" y="925" class="mono ink" font-size="10.5" opacity="0.7">oily / dry / combo / sensitive (bare-face 1-h)</text>
      <text x="455" y="950" class="mono ink" font-size="11" opacity="0.85">▸ Fitzpatrick I–VI</text>
      <text x="472" y="967" class="mono ink" font-size="10.5" opacity="0.7">most Malaysians III–V → PIH risk ↑</text>
      <text x="472" y="982" class="mono red" font-size="10.5" font-weight="700">wrong laser on darker skin = burns + PIH</text>
      <text x="455" y="1007" class="mono ink" font-size="11" opacity="0.85">▸ concern map</text>
      <text x="472" y="1024" class="mono ink" font-size="10.5" opacity="0.7">acne / aging / pigment / redness / barrier</text>
      <text x="455" y="1045" class="mono slate" font-size="10.5" font-weight="700">judge no active &lt; 12 weeks (≈1 cycle ×2–3)</text>
    </g>

    <!-- CARD 3 : THE TWO BOUNDARIES -->
    <g id="card3">
      <rect x="790" y="852" width="330" height="200" fill="none" stroke="#5E7585" stroke-width="1.2" rx="6"/>
      <text x="810" y="880" class="mono slate" font-size="13" font-weight="700">THE TWO BOUNDARIES</text>
      <text x="810" y="900" class="mono ink" font-size="10" opacity="0.6">the series navigation rule</text>
      <line x1="810" y1="912" x2="1100" y2="912" stroke="#5E7585" stroke-width="0.8" opacity="0.5"/>
      <text x="955" y="948" class="mono ink" font-size="16" font-weight="700" text-anchor="middle">FACE ≠ BODY</text>
      <text x="955" y="968" class="mono ink" font-size="10.5" text-anchor="middle" opacity="0.7">two organs · Part 2.0 vs 3.0</text>
      <line x1="840" y1="988" x2="1070" y2="988" stroke="#5E7585" stroke-width="0.8" opacity="0.5"/>
      <text x="955" y="1018" class="mono ink" font-size="14" font-weight="700" text-anchor="middle">TOPICAL ≠ INTERNAL</text>
      <text x="955" y="1036" class="mono ink" font-size="14" font-weight="700" text-anchor="middle">≠ PROCEDURAL</text>
      <text x="955" y="1052" class="mono ink" font-size="10.5" text-anchor="middle" opacity="0.7">match the lever to the layer</text>
    </g>
  </g>

  <!-- ===================== FOOTER : THESIS + DECISION STRIP ===================== -->
  <g id="footer">
    <line x1="80" y1="1090" x2="1120" y2="1090" stroke="#1E2024" stroke-width="1.2"/>
    <text x="600" y="1140" class="ink" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">PROTECT THE 90% BEFORE YOU POLISH THE 10%.</text>
    <text x="600" y="1170" class="mono ink" font-size="13" text-anchor="middle" opacity="0.6">~80% of visible facial aging is photoaging — cumulative UV, not the calendar.</text>

    <!-- decision strip : 4 chips sized to match the four layer thicknesses -->
    <g id="strip" transform="translate(0,1210)">
      <!-- PROTECT : largest -->
      <rect x="100" y="0" width="300" height="86" fill="#C2703D"/>
      <text x="250" y="40" class="mono" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">PROTECT</text>
      <text x="250" y="66" class="mono" fill="#FFFFFF" font-size="13" text-anchor="middle">90%</text>
      <!-- TREAT -->
      <rect x="416" y="22" width="230" height="64" fill="#D89A6E"/>
      <text x="531" y="50" class="mono ink" font-size="17" font-weight="700" text-anchor="middle">TREAT</text>
      <text x="531" y="70" class="mono ink" font-size="12" text-anchor="middle">10%</text>
      <!-- MULTIPLY -->
      <rect x="662" y="42" width="180" height="44" fill="none" stroke="#1E2024" stroke-width="2"/>
      <text x="752" y="64" class="mono ink" font-size="14" font-weight="700" text-anchor="middle">MULTIPLY</text>
      <text x="752" y="80" class="mono ink" font-size="9.5" text-anchor="middle" opacity="0.6">procedures</text>
      <!-- PUSH : sliver -->
      <rect x="858" y="58" width="160" height="28" fill="#1E2024"/>
      <text x="938" y="77" class="mono" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">PUSH LAST ▲</text>
      <!-- flow arrows -->
      <line x1="402" y1="43" x2="414" y2="43" stroke="#1E2024" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="648" y1="54" x2="660" y2="54" stroke="#1E2024" stroke-width="2" marker-end="url(#ah)"/>
      <line x1="844" y1="64" x2="856" y2="64" stroke="#1E2024" stroke-width="2" marker-end="url(#ah)"/>
    </g>
  </g>

  <text x="600" y="1442" class="mono ink" font-size="11" text-anchor="middle" opacity="0.45">If You're So Smart, Why Are You Not — Attractive / Skin · an outside-in wall section · thickness = leverage</text>
</svg>
